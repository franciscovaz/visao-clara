name = "export-documents-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.development]
name = "export-documents-worker-development"

[env.development.vars]
STORAGE_PROVIDER = "s3"
SUPABASE_URL = "http://127.0.0.1:54321"
S3_ENDPOINT_URL = "http://127.0.0.1:9000"
S3_REGION = "us-east-1"
S3_BUCKET = "visao-clara-docs"

# DEV cloud project (visao-clara-dev): rehearsal of the production setup. Bucket: a DEV-only
# private R2 bucket, never the production one. Secrets: `wrangler secret put ... --env staging`.
[env.staging]
name = "export-documents-worker-staging"

[env.staging.vars]
STORAGE_PROVIDER = "r2"
SUPABASE_URL = "https://xqdsxkmtzkccnbdiuzhn.supabase.co"
S3_REGION = "auto"
# Name of the bucket bound below as R2_BUCKET; document rows must point at it.
R2_BUCKET_NAME = "visao-clara-docs-dev"

# EU jurisdiction bucket: without `jurisdiction` the binding would look in the default namespace
[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "visao-clara-docs-dev"
jurisdiction = "eu"

# Production project (visao-clara-prod). Secrets: `wrangler secret put ... --env production`.
[env.production]
name = "export-documents-worker-production"

[env.production.vars]
STORAGE_PROVIDER = "r2"
SUPABASE_URL = "https://owmryjakruspyxrwgldx.supabase.co"
S3_REGION = "auto"
# Name of the bucket bound below as R2_BUCKET; document rows must point at it.
# REPLACE before deploying (a deploy with the placeholder fails: the bucket does not exist).
R2_BUCKET_NAME = "replace-with-prod-r2-bucket-name"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "replace-with-prod-r2-bucket-name"
